[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "database-disaggregation"
version = "0.1.0"
description = "Data preparation and GTAP database disaggregation workflows for ENTICE with MARIO/CVXLab"
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
]

[project.optional-dependencies]
export = ["pandas", "pyarrow"]
# Needed only for the QA plotting module (database_disaggregation.export.plot_d24_split).
plots = ["pandas", "numpy", "matplotlib"]
reconcile = ["pandas>=2.3.3", "numpy", "pyarrow", "scipy", "cvxpy"]
benchmark = ["pandas", "numpy", "pyarrow", "scipy", "plotly"]
analysis = ["pandas>=2.1", "numpy", "pyarrow", "scipy", "plotly"]
mappings = ["h5py"]

# Note: the database steps in scripts/run_d24_pipeline.py also require `mario`,
# which is installed separately (local/Git checkout), not from PyPI.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"database_disaggregation.core" = ["benchmark_dashboard.html"]
"database_disaggregation.reporting" = ["templates/*.html", "templates/*.js", "assets/*.svg", "assets/*.png"]

[tool.setuptools.data-files]
"share/database-disaggregation/registry" = [
    "data/registry/sectors.json",
    "data/registry/regions.json",
    "data/registry/gtap12.json",
]
"share/database-disaggregation/config" = ["config/cleaning-policy.json"]
